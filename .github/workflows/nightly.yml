name: Pull Metrics

on:
  workflow_dispatch:
  schedule:
  # Every night at 04:00 (UTC)
    - cron: "0 4 * * *"

permissions: read-all

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content
        with:
          token: ${{ secrets.KIALI_BOT_TOKEN }}

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # install the python version needed      
      - name: install python packages
        run: |          
          python -m pip install --upgrade pip
          pip install -r scripts/api_gh/requirements.txt

      - name: execute py script # run main.py
        env:
          KIALI_BOT_TOKEN: ${{ secrets.KIALI_BOT_TOKEN }}
        run: make generate_metrics_json

      - name: Configure kiali-bot git
        uses: ./.github/actions/configure-kiali-bot-git
        with:
          signing-key: ${{ secrets.KIALI_BOT_SIGNING_KEY }}

      - name: Update metrics file
        run: |
          if [[ `git status --porcelain` ]]; then
            echo -e "\e[1;32mOK\e[0m \e[1;39mMetrics json change detected.\e[0m"
            git add website/src/data/metrics.json
            git commit -m "Update metrics.json"
            git push origin
          else
            echo -e "\e[1;39mNo changes were detected.\e[0m"
          fi
        shell: bash  

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: website/yarn.lock   
      - name: Update events
        run: |
          echo "Updating"   
          make generate_event_json
      - name: Install and Build 🔧
        env:
         PUBLIC_URL: https://kiali.org/community/
        run: make build          

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: website/build          